<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Technology Roadmap</title><style>:root{--bg:#00131d;--panel:#061f2e;--cyan:#13d8ff;--text:#edf8ff;--muted:#91aabd;--line:#17445c;--green:#18e5a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#092d54 0,transparent 28%),var(--bg);color:var(--text);font:15px Segoe UI,Arial,sans-serif}.top{height:68px;border-bottom:1px solid #17445c;display:flex;align-items:center;gap:18px;padding:0 28px;background:#00111c}.back{color:var(--cyan);text-decoration:none;font-weight:700}.brand{font-size:18px;font-weight:800}.wrap{max-width:1180px;margin:auto;padding:34px 24px}.hero{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:25px}.eyebrow{color:var(--cyan);text-transform:uppercase;letter-spacing:.16em;font-weight:700}.hero h1{font-size:40px;margin:8px 0}.hero p{color:var(--muted);max-width:700px;line-height:1.6}.meter{min-width:230px}.track{height:11px;background:#183445;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#1b96ff,#18e5a0);transition:.25s}.count{margin-top:10px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.module{background:linear-gradient(145deg,#082638,#041a28);border:1px solid var(--line);border-radius:14px;padding:18px}.module h2{margin:0 0 14px;font-size:19px;color:#fff}.item{display:flex;gap:11px;padding:10px 0;border-top:1px solid rgba(145,170,189,.15);align-items:flex-start}.item input{width:18px;height:18px;accent-color:var(--green)}.item label{cursor:pointer;line-height:1.35}.note{margin-top:26px;padding:16px;border-left:3px solid var(--cyan);background:#052233;color:#bcd2df}@media(max-width:760px){.hero{display:block}.meter{margin-top:22px}.grid{grid-template-columns:1fr}.hero h1{font-size:31px}}</style></head><body><header class="top"><a class="back" href="index.html">← Dashboard</a><span class="brand">DBA & CLOUD · LEARNING COMMAND CENTER</span></header><main class="wrap"><section class="hero"><div><div class="eyebrow">Learning Roadmap</div><h1 id="title">Technology Roadmap</h1><p id="intro"></p></div><div class="meter"><div class="track"><div class="fill" id="fill"></div></div><div class="count" id="count">0 of 24 objectives completed</div></div></section><div class="grid" id="grid"></div><div class="note">Progress is saved automatically in this browser. Select any objective to update the roadmap and dashboard learning state.</div></main><script>const names={oracle:'Oracle DBA',postgresql:'PostgreSQL',mysql:'MySQL',sqlserver:'Microsoft SQL Server',mongodb:'MongoDB',aws:'AWS',azure:'Microsoft Azure',gcp:'Google Cloud',oci:'Oracle Cloud Infrastructure',docker:'Docker',kubernetes:'Kubernetes',linux:'Linux',shell:'Shell Scripting',powershell:'PowerShell',python:'Python',git:'Git',terraform:'Terraform',ansible:'Ansible',jenkins:'Jenkins'};const p=new URLSearchParams(location.search),tech=p.get('tech')||'oracle',name=names[tech]||'Technology';document.title=name+' Roadmap';document.getElementById('title').textContent=name+' Roadmap';document.getElementById('intro').textContent='A practical, editable learning path covering foundations, administration, security, operations, performance, automation, labs, and interview readiness for '+name+'.';const modules=[['1. Foundations',['Architecture and core components','Installation and environment setup','Services, processes, and storage','Essential terminology']],['2. Administration',['User and access management','Configuration and parameter management','Routine health checks','Capacity and lifecycle operations']],['3. Backup & Recovery',['Backup strategy and retention','Restore and recovery workflow','Point-in-time recovery','Disaster recovery validation']],['4. Performance',['Monitoring and baseline creation','Query and workload analysis','Index and storage tuning','Performance troubleshooting lab']],['5. Security & Automation',['Authentication and authorization','Auditing and hardening','Command-line automation','Infrastructure as code integration']],['6. Practice & Interview',['Build a hands-on lab','Troubleshoot a production scenario','Document an operational runbook','Complete interview question set']]];const key='roadmap-'+tech;let done=new Set(JSON.parse(localStorage.getItem(key)||'[]'));const grid=document.getElementById('grid');let i=0;modules.forEach(m=>{const card=document.createElement('section');card.className='module';card.innerHTML='<h2>'+m[0]+'</h2>';m[1].forEach(t=>{const id='o'+i++;const row=document.createElement('div');row.className='item';row.innerHTML='<input type="checkbox" id="'+id+'" '+(done.has(id)?'checked':'')+'><label for="'+id+'">'+t+'</label>';row.querySelector('input').addEventListener('change',e=>{e.target.checked?done.add(id):done.delete(id);localStorage.setItem(key,JSON.stringify([...done]));update()});card.appendChild(row)});grid.appendChild(card)});function update(){const total=i,n=done.size,pct=Math.round(n/total*100);document.getElementById('fill').style.width=pct+'%';document.getElementById('count').textContent=n+' of '+total+' objectives completed · '+pct+'%'}update();</script></body></html>
