<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oracle DBA Roadmap</title><style>body{font-family:Segoe UI,Arial;background:#05111b;color:#eaf6ff;margin:0;padding:24px}a{color:#40cfff}h1{color:#2aa8ff}.m{background:#091a27;border:1px solid #23455c;border-radius:12px;margin:12px 0;padding:16px}.item{padding:7px 0;border-top:1px solid #163144}.meta{color:#86a8bb;font-size:12px}.progress{color:#2ce2a3}</style></head><body><a href="../index.html">← Dashboard</a><h1>Oracle Database DBA Roadmap</h1><p id="sum">Loading roadmap…</p><div id="mods"></div><script>fetch('../data/oracle-roadmap.json').then(r=>r.json()).then(d=>{const done=new Set(JSON.parse(localStorage.getItem('oracleCompleted')||'[]'));document.getElementById('sum').textContent=`${d.currentItemCount} granular checklist items across ${d.modules.length} modules · ${done.size} completed`;const el=document.getElementById('mods');el.innerHTML=d.modules.map(m=>`<div class="m"><h2>${m.id} · ${m.title}</h2><p class="meta">${m.description}</p>${m.items.map(x=>`<div class="item"><label><input type="checkbox" data-id="${x.id}" ${done.has(x.id)?'checked':''}> ${x.id}: ${x.title}</label><div class="meta">${x.type} · ${x.difficulty} · ~${x.estimatedMinutes} min</div></div>`).join('')}</div>`).join('');el.onchange=e=>{if(e.target.matches('input[data-id]')){const s=new Set(JSON.parse(localStorage.getItem('oracleCompleted')||'[]'));e.target.checked?s.add(e.target.dataset.id):s.delete(e.target.dataset.id);localStorage.setItem('oracleCompleted',JSON.stringify([...s]));document.getElementById('sum').textContent=`${d.currentItemCount} granular checklist items across ${d.modules.length} modules · ${s.size} completed`;}}}).catch(()=>document.getElementById('sum').textContent='Roadmap data could not be loaded.');</script></body></html>
